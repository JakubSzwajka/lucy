services:
  gateway:
    build:
      context: .
      target: deps
    command: sh -c "npm run build && npx -y nodemon --legacy-watch --watch src --ext ts,json --exec npx\\ tsx\\ src/gateway/core/src/index.ts"
    ports:
      - "${PORT:-3080}:${PORT:-3080}"
    environment:
      - NODE_ENV=development
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - PORT=${PORT:-3080}
      - PI_MODEL=${PI_MODEL}
      - PI_PROMPT=${PI_PROMPT:-PROMPT.md}
      - PI_CODING_AGENT_DIR=/root/.pi
      - LUCY_API_KEY=${LUCY_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    volumes:
      - ./src:/app/src
      - ./docs:/app/docs
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./PROMPT.md:/app/PROMPT.md
      - ./.agents:/app/.agents
      - ./.pi:/root/.pi
